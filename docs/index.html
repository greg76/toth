<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Top of The Hops — Trending Homebrew packages</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --ink: #171914;
      --muted: #6d7066;
      --paper: #f4f1e8;
      --card: #fbfaf5;
      --hop: #4f7c45;
      --hop-dark: #31552e;
      --hop-light: #dce7d7;
      --border: #dedbd0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.5;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0 70px;
    }

    .eyebrow {
      width: fit-content;
      margin-left: auto;
      margin-bottom: 20px;
      padding: 6px 10px;
      background: var(--hop-light);
      color: var(--hop-dark);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(52px, 9vw, 100px);
      line-height: 0.88;
      letter-spacing: -0.075em;
      font-weight: 850;
    }

    h1 span {
      color: var(--hop);
    }

    .hero-copy {
      max-width: 850px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 2.2vw, 22px);
      letter-spacing: -0.02em;
    }

    main {
      padding: 0 0 70px;
    }

    .chart-list {
      display: grid;
      gap: 28px;
    }

    .chart-card {
      display: grid;
      grid-template-columns: minmax(190px, 0.32fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(25px, 5vw, 64px);
      min-height: 410px;
      margin: 0;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.02),
        0 15px 40px rgba(0, 0, 0, 0.025);
    }

    .chart-card-copy {
      align-self: start;
      padding-top: 5px;
    }

    .section-number {
      margin-bottom: 22px;
      color: var(--border);
      font-family: Georgia, serif;
      font-size: 70px;
      line-height: 0.7;
    }

    .chart-card h2 {
      margin: 0;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .chart-card .description {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .chart-wrapper {
      position: relative;
      height: 360px;
      min-width: 0;
    }

    .loading,
    .error {
      margin: 0;
      padding: 40px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 18px;
    }

    .error {
      color: var(--hop-dark);
    }

    footer {
      padding: 50px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 30px;
    }

    footer strong {
      color: var(--ink);
    }

    @media (max-width: 760px) {
      header {
        padding-bottom: 55px;
      }

      .container {
        width: min(100% - 28px, 1120px);
      }

      .chart-card {
        grid-template-columns: 1fr;
        gap: 28px;
        min-height: 0;
        padding: 20px;
        border-radius: 14px;
      }

      .chart-card-copy {
        padding-top: 0;
      }

      .section-number {
        margin-bottom: 16px;
        font-size: 52px;
      }

      .chart-wrapper {
        height: 300px;
      }

      .footer-inner {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="eyebrow">🍺 Homebrew analytics</div>

      <h1>
        Top of<br>The <span>Hops.</span>
      </h1>

      <p class="hero-copy">
        Trending Homebrew packages, scraped and served weekly.
      </p>
    </div>
  </header>

  <main>
    <div class="container">
      <section id="chartList" class="chart-list" aria-label="Homebrew trend charts">
        <p class="loading">Pouring the latest charts…</p>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-inner">
        <div>
          <strong>Top of The Hops</strong><br>
          Homebrew package trends, minus the hangover.
        </div>

        <div>
          Last tapped: <span id="lastUpdated"></span><br>
          No lagers were harmed in the making of these charts.
        </div>
      </div>
    </div>
  </footer>

  <script>
    const CHARTS_URL = "charts.json";
    const THOUSAND = 1_000;
    const MILLION = 1_000_000;
    const MAX_CATEGORY_LABEL_LENGTH = 24;
    const COLORS = [
      "#4f7c45",
      "#c48a38",
      "#171914",
      "#31552e",
      "#8c6b2f"
    ];

    Chart.defaults.font.family =
      'Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    Chart.defaults.color = "#6d7066";

    const commonOptions = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: {
            usePointStyle: true,
            pointStyle: "circle",
            padding: 20
          }
        },
        tooltip: {
          backgroundColor: "#171914",
          titleColor: "#ffffff",
          bodyColor: "#ffffff",
          padding: 12,
          cornerRadius: 8,
          displayColors: true
        }
      },
      scales: {
        x: {
          grid: {
            display: false
          },
          border: {
            display: false
          },
          ticks: {
            padding: 8
          }
        },
        y: {
          grid: {
            color: "#e7e4da"
          },
          border: {
            display: false
          },
          ticks: {
            padding: 8
          }
        }
      }
    };

    function formatNumber(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) {
        return value;
      }

      if (Math.abs(number) >= MILLION) {
        return `${(number / MILLION).toFixed(1).replace(/\.0$/, "")}m`;
      }

      if (Math.abs(number) >= THOUSAND) {
        return `${(number / THOUSAND).toFixed(1).replace(/\.0$/, "")}k`;
      }

      return number.toLocaleString();
    }

    function shortenCategoryLabel(value) {
      const label = String(value);
      if (label.length <= MAX_CATEGORY_LABEL_LENGTH) {
        return label;
      }

      return `${label.slice(0, MAX_CATEGORY_LABEL_LENGTH - 1)}…`;
    }

    function mergeOptions(chart) {
      const supplied = chart.config.options || {};
      const isBar = chart.config.type === "bar";
      const defaults = isBar
        ? {
            indexAxis: "y",
            plugins: {
              legend: {
                display: false
              }
            },
            scales: {
              x: {
                ...commonOptions.scales.y,
                beginAtZero: true,
                ticks: {
                  ...commonOptions.scales.y.ticks,
                  callback: formatNumber
                }
              },
              y: {
                ...commonOptions.scales.x,
                ticks: {
                  ...commonOptions.scales.x.ticks,
                  callback(value) {
                    return shortenCategoryLabel(this.getLabelForValue(value));
                  }
                }
              }
            }
          }
        : {
            interaction: {
              intersect: false,
              mode: "index"
            },
            scales: {
              y: {
                ...commonOptions.scales.y,
                ticks: {
                  ...commonOptions.scales.y.ticks,
                  callback: formatNumber
                }
              }
            }
          };

      const defaultPlugins = defaults.plugins || {};
      const suppliedPlugins = supplied.plugins || {};
      const defaultScales = defaults.scales || {};
      const suppliedScales = supplied.scales || {};

      return {
        ...commonOptions,
        ...defaults,
        ...supplied,
        plugins: {
          ...commonOptions.plugins,
          ...defaultPlugins,
          ...suppliedPlugins,
          legend: {
            ...commonOptions.plugins.legend,
            ...(defaultPlugins.legend || {}),
            ...(suppliedPlugins.legend || {})
          },
          tooltip: {
            ...commonOptions.plugins.tooltip,
            ...(defaultPlugins.tooltip || {}),
            ...(suppliedPlugins.tooltip || {}),
            callbacks: {
              label: context => {
                const label = context.dataset.label || "Value";
                const value = formatNumber(context.raw);
                const unit = label.includes("%") ? "%" : "";
                return `  ${label}: ${value}${unit}`;
              },
              ...(suppliedPlugins.tooltip?.callbacks || {})
            }
          }
        },
        scales: {
          ...commonOptions.scales,
          ...defaultScales,
          ...suppliedScales,
          x: {
            ...commonOptions.scales.x,
            ...(defaultScales.x || {}),
            ...(suppliedScales.x || {})
          },
          y: {
            ...commonOptions.scales.y,
            ...(defaultScales.y || {}),
            ...(suppliedScales.y || {})
          }
        }
      };
    }

    function styledDatasets(chart) {
      const datasets = chart.config.data.datasets || [];
      const isBar = chart.config.type === "bar";

      return datasets.map((dataset, index) => ({
        ...dataset,
        ...(isBar
          ? {
              backgroundColor: dataset.backgroundColor || COLORS[index % COLORS.length],
              borderRadius: dataset.borderRadius ?? 6,
              barThickness: dataset.barThickness ?? 24
            }
          : {
              borderColor: dataset.borderColor || COLORS[index % COLORS.length],
              backgroundColor: dataset.backgroundColor || "transparent",
              borderWidth: dataset.borderWidth ?? 2.5,
              pointRadius: dataset.pointRadius ?? 3,
              pointHoverRadius: dataset.pointHoverRadius ?? 6,
              tension: dataset.tension ?? 0.35
            })
      }));
    }

    function createChartCard(chart, index) {
      const card = document.createElement("article");
      card.className = "chart-card";

      const copy = document.createElement("div");
      copy.className = "chart-card-copy";

      const number = document.createElement("div");
      number.className = "section-number";
      number.textContent = String(index + 1).padStart(2, "0");
      copy.append(number);

      const title = document.createElement("h2");
      title.textContent = chart.title;
      copy.append(title);

      if (chart.description) {
        const description = document.createElement("p");
        description.className = "description";
        description.textContent = chart.description;
        copy.append(description);
      }

      const wrapper = document.createElement("div");
      wrapper.className = "chart-wrapper";

      const canvas = document.createElement("canvas");
      canvas.id = chart.id;
      canvas.setAttribute("aria-label", chart.title);
      wrapper.append(canvas);

      card.append(copy, wrapper);
      return { card, canvas };
    }

    function renderCharts(charts) {
      const chartList = document.getElementById("chartList");
      const renderedCharts = charts.map(createChartCard);
      const fragment = document.createDocumentFragment();

      renderedCharts.forEach(({ card }) => fragment.append(card));
      chartList.replaceChildren(fragment);

      renderedCharts.forEach(({ canvas }, index) => {
        const chart = charts[index];
        new Chart(canvas, {
          type: chart.config.type,
          data: {
            ...chart.config.data,
            datasets: styledDatasets(chart)
          },
          options: mergeOptions(chart)
        });
      });
    }

    async function loadCharts() {
      const chartList = document.getElementById("chartList");

      try {
        const response = await fetch(CHARTS_URL);
        if (!response.ok) {
          throw new Error(`Could not load ${CHARTS_URL}: ${response.status}`);
        }

        const charts = await response.json();
        if (!Array.isArray(charts)) {
          throw new Error("Chart data must be a list.");
        }

        renderCharts(charts);
      } catch (error) {
        console.error(error);
        chartList.replaceChildren();

        const message = document.createElement("p");
        message.className = "error";
        message.textContent = "The latest charts could not be loaded.";
        chartList.append(message);
      }
    }

    document.getElementById("lastUpdated").textContent =
      new Date().toLocaleString(undefined, {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

    loadCharts();
  </script>
</body>
</html>
