name: Weekly analytics update

on:
  schedule:
    - cron: "17 9 * * 0"
      timezone: "Europe/Zurich"
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: weekly-analytics-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install workflow dependencies
        run: python -m pip install -r requirements-workflow.txt

      - name: Confirm historical snapshots are present
        run: >-
          python -c "from pathlib import Path; dumps = Path('dumps');
          assert any(dumps.glob('*formula.zst')) and any(dumps.glob('*cask.zst')),
          'Commit the existing dumps/*.zst snapshots so the update can rebuild history.'"

      - name: Rebuild database, fetch latest data, and generate charts
        run: |
          python fetch.py --backfill
          python fetch.py
          python charts.py > docs/charts.json

      - name: Commit updated snapshots and chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dumps/*.zst docs/charts.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update weekly Homebrew data"
            git push
          fi

      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
